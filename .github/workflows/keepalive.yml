name: Supabase Keep-Alive

on:
  schedule:
    - cron: '30 2,14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via keepalive RPC (burst)
        run: |
          # Supabase pauses free projects on LOW database activity: their
          # guideline is "a few user requests to the database each day over
          # the previous week". A single ping every 2 days was below that bar
          # (pause warning sent Oct 2026), so fire a small burst twice daily.
          for i in 1 2 3 4; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://vuktzhuotblwqlorkyhq.supabase.co/rest/v1/rpc/keepalive_ping" \
              -H "apikey: sb_publishable_A7Qj_HAV-Ml4HKeSwY82Dw_L7eCm0Hg" \
              -H "Authorization: Bearer sb_publishable_A7Qj_HAV-Ml4HKeSwY82Dw_L7eCm0Hg" \
              -H "Content-Type: application/json" -d "{}")
            echo "keepalive ping $i -> HTTP $CODE"
            if [ "$CODE" != "200" ] && [ "$CODE" != "204" ]; then
              echo "Supabase keep-alive FAILED (HTTP $CODE) - check the project"
              exit 1
            fi
            sleep 3
          done
